name: release

on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'README.md'
      - 'pom.xml'
      - 'ratelimitly-spring-boot-autoconfigure/**'
      - 'ratelimitly-spring-boot-sample-app/**'
      - 'ratelimitly-spring-boot-starter/**'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a release mid-flight. This is the opposite of ci.yml on purpose.
  cancel-in-progress: false

env:
  # The pom declares no version for maven-help-plugin, so it is named in full on the command
  # line and may not float onto a newer plugin release mid-flight.
  MAVEN_HELP_PLUGIN: org.apache.maven.plugins:maven-help-plugin:3.5.2

  # The exact set of modules this repository releases. contracts asserts pom.xml declares
  # exactly these, jars stages exactly these, and aggregate accepts exactly these. Adding a
  # module means adding it here, deliberately, rather than discovering later that a release
  # quietly shipped without it.
  RELEASE_MODULES: >-
    ratelimitly-spring-boot-autoconfigure
    ratelimitly-spring-boot-starter
    ratelimitly-spring-boot-sample-app

  # Temporary public-source pin for Java client 3.0.0-SNAPSHOT compatibility.
  # No cross-repository credential is needed. Keep aligned with ci.yml/security.yml.
  # Replace source installation after the client is published to Central.
  RL_JAVA_CLIENT_COMMIT: fb0b26f1e514188a569eaf8fab5685c562111bac
  RL_JAVA_CLIENT_DIR: _deps/rl-java-client

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      build: ${{ steps.metadata.outputs.build }}
      commit: ${{ steps.metadata.outputs.commit }}
      epoch: ${{ steps.metadata.outputs.epoch }}
      publish: ${{ steps.metadata.outputs.publish }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Resolve immutable build metadata
        id: metadata
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # The parent pom is the single source of truth for the released version: bumping
          # <version> on main is what cuts a release. Nobody pushes a tag by hand. Read it with
          # Maven rather than grep so the answer is the one Maven itself would use. `validate`
          # resolves the effective model without needing the unpublished rl-java-client
          # SNAPSHOT, so this job needs no sibling checkout.
          raw_version="$(
            mvn -B -ntp -q -DforceStdout \
              "${MAVEN_HELP_PLUGIN}:evaluate" \
              -Dexpression=project.version
          )"
          version="$(printf '%s\n' "$raw_version" | tail -n 1 | tr -d '[:space:]')"
          if [[ -z "$version" ]]; then
            echo "::error::could not read project.version from pom.xml"
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9A-Za-z][0-9A-Za-z.+_-]*$ ]]; then
            echo "::error::project.version '${version}' is not a usable Maven version"
            exit 1
          fi

          commit="$(git rev-parse HEAD)"
          epoch="$(git show -s --format=%ct HEAD)"
          release_tag="v${version}"
          publish=false

          # THE SNAPSHOT GUARD.
          #
          # A -SNAPSHOT is Maven's marker for "work in progress, contents may change under this
          # coordinate". It is not a releasable version. The tempting shortcut -- strip the
          # suffix and publish 0.1.0 -- ships an artifact the pom never claimed to be, and
          # burns the 0.1.0 coordinate for the real 0.1.0. So this workflow refuses instead of
          # guessing.
          #
          # What it does NOT do is turn that refusal into a permanent red X. Both poms are
          # SNAPSHOT by design and stay that way until someone deliberately cuts a release, so
          # failing every push to main would fire forever, and an alarm that is always on
          # teaches people to ignore the one that matters. A SNAPSHOT on main is therefore a
          # notice: green, quiet, and it publishes nothing. The invariant that actually
          # prevents a wrong publish is below -- publish=true is impossible unless the version
          # is MAJOR.MINOR.PATCH.
          #
          # A version that is malformed rather than merely a SNAPSHOT still fails, and so does
          # a tag that points at a different commit. Those mean something is actually wrong.
          #
          # Spring and the Java client are versioned independently. This migration stays
          # on a SNAPSHOT so merging it cannot publish a package or GitHub release.
          releasable=true
          malformed=false
          refusal=""
          if [[ "$version" == *-SNAPSHOT ]]; then
            releasable=false
            refusal="pom.xml is at ${version}, which is not a releasable version. Set <version> in pom.xml (and in each module's <parent>) to a MAJOR.MINOR.PATCH release version and push that to main to cut a release. This workflow will not strip the -SNAPSHOT suffix and publish ${version%-SNAPSHOT} on the pom's behalf."
          elif [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            releasable=false
            malformed=true
            refusal="pom.xml is at ${version}, which is not MAJOR.MINOR.PATCH. Set <version> in pom.xml to a numeric release version."
          fi

          # Resolve a tag to the commit it points at, dereferencing annotated tags. This uses
          # the API rather than git because the checkout above drops its credentials and this
          # repository is private, so an unauthenticated `git fetch origin` cannot see the tag.
          tag_target() {
            local ref_json object_type object_sha
            ref_json="$(gh api "repos/${GH_REPO}/git/ref/tags/$1" 2>/dev/null)" || return 1
            object_type="$(printf '%s' "$ref_json" | jq -r '.object.type')"
            object_sha="$(printf '%s' "$ref_json" | jq -r '.object.sha')"
            if [[ "$object_type" == tag ]]; then
              object_sha="$(gh api "repos/${GH_REPO}/git/tags/${object_sha}" --jq '.object.sha')"
            fi
            printf '%s' "$object_sha"
          }

          verify_tag_commit() {
            local tag_commit
            if ! tag_commit="$(tag_target "$release_tag")"; then
              # A draft release does not create its tag until it is published, so an absent
              # tag is normal here and there is nothing to contradict.
              return 0
            fi
            if [[ "$tag_commit" != "$commit" ]]; then
              echo "::error::${release_tag} points at ${tag_commit}, expected ${commit}"
              exit 1
            fi
          }

          case "$GITHUB_EVENT_NAME" in
            push)
              if [[ "$GITHUB_REF" != refs/heads/main ]]; then
                echo "::error::releases are only cut from main, not ${GITHUB_REF}"
                exit 1
              fi
              if [[ "$malformed" == true ]]; then
                echo "::error::${refusal}"
                {
                  echo "### Release refused"
                  echo
                  echo "${refusal}"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
              if [[ "$releasable" != true ]]; then
                # The steady state of this repository. Nothing is wrong; nothing is released.
                echo "::notice::${refusal}"
              elif gh release view "$release_tag" >/dev/null 2>&1; then
                state="$(
                  gh release view "$release_tag" \
                    --json isDraft \
                    --jq .isDraft
                )"
                if [[ "$state" == true ]]; then
                  verify_tag_commit
                  publish=true
                else
                  echo "${release_tag} already published; bump the pom version for the next release"
                fi
              elif tag_target "$release_tag" >/dev/null 2>&1; then
                verify_tag_commit
                publish=true
              else
                publish=true
              fi
              ;;
            pull_request|workflow_dispatch)
              # Dry run: build and aggregate the exact release asset set, publish nothing,
              # so the release path stays exercised before it matters.
              if [[ "$releasable" != true ]]; then
                echo "::notice::${refusal} This run is a dry run: it builds and checks the release assets but publishes nothing."
              fi
              ;;
            *)
              echo "::error::unsupported release event: ${GITHUB_EVENT_NAME}"
              exit 1
              ;;
          esac

          # Whether the build jobs run at all. Pull requests and workflow_dispatch always
          # exercise the release path. A push to main only does so when it will actually
          # publish, so a routine push on a SNAPSHOT costs one short green job instead of a
          # full rebuild that ci.yml has already done.
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            build="$publish"
          else
            build=true
          fi

          # Belt and braces: nothing may reach the publish jobs on a non-release version.
          if [[ "$publish" == true && ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::refusing to publish non-release version ${version}"
            exit 1
          fi
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$epoch" =~ ^[0-9]+$ ]]

          {
            echo "build=$build"
            echo "commit=$commit"
            echo "epoch=$epoch"
            echo "publish=$publish"
            echo "tag=$release_tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Release metadata"
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| version | \`${version}\` |"
            echo "| tag | \`${release_tag}\` |"
            echo "| commit | \`${commit}\` |"
            echo "| SOURCE_DATE_EPOCH | \`${epoch}\` |"
            echo "| publish | \`${publish}\` |"
            echo "| build | \`${build}\` |"
            if [[ "$releasable" != true ]]; then
              echo
              echo "**No release was cut.** ${refusal}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  contracts:
    name: Release contracts
    if: needs.metadata.outputs.build == 'true'
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate the Maven reactor
        # validate builds the effective model for all four projects without resolving the
        # Java-client artifact, so this needs no sibling checkout.
        run: mvn -B -ntp validate

      - name: Check the released module set matches the pom
        shell: bash
        run: |
          set -euo pipefail
          # Word splitting on RELEASE_MODULES is intentional, as in the loops below.
          # shellcheck disable=SC2086
          printf '%s\n' $RELEASE_MODULES | LC_ALL=C sort > "$RUNNER_TEMP/release-modules.txt"
          sed -n 's#.*<module>\(.*\)</module>.*#\1#p' pom.xml \
            | LC_ALL=C sort > "$RUNNER_TEMP/pom-modules.txt"
          if ! diff -u "$RUNNER_TEMP/release-modules.txt" "$RUNNER_TEMP/pom-modules.txt"; then
            echo "::error file=pom.xml::pom.xml declares modules that RELEASE_MODULES in .github/workflows/release.yml does not, or vice versa"
            exit 1
          fi

      - name: Check the documented versions match the release
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail

          # README.md is the install instruction people copy. A release whose README advertises
          # a different coordinate than the one being published is a broken release.
          if ! grep -qF "<version>${VERSION}</version>" README.md; then
            echo "::error file=README.md::README.md does not advertise <version>${VERSION}</version> for the starter"
            exit 1
          fi

          client_raw="$(
            mvn -B -ntp -q -DforceStdout \
              "${MAVEN_HELP_PLUGIN}:evaluate" \
              -Dexpression=ratelimitly-java-client.version
          )"
          client_version="$(printf '%s\n' "$client_raw" | tail -n 1 | tr -d '[:space:]')"
          if ! grep -qF "com.ratelimitly:ratelimitly-java-client:${client_version}" README.md; then
            echo "::error file=README.md::README.md does not name com.ratelimitly:ratelimitly-java-client:${client_version}, which is what pom.xml depends on"
            exit 1
          fi
          echo "README.md agrees: starter ${VERSION}, java client ${client_version}" \
            >> "$GITHUB_STEP_SUMMARY"

  jars:
    name: Build release jars
    if: needs.metadata.outputs.build == 'true'
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out pinned rl-java-client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ratelimitly-com/rl-java-client
          ref: ${{ env.RL_JAVA_CLIENT_COMMIT }}
          path: ${{ env.RL_JAVA_CLIENT_DIR }}
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Record toolchain
        run: |
          java -version
          mvn -v

      - name: Install pinned rl-java-client
        shell: bash
        run: |
          set -euo pipefail
          resolved="$(git -C "$RL_JAVA_CLIENT_DIR" rev-parse HEAD)"
          if [[ "$resolved" != "$RL_JAVA_CLIENT_COMMIT" ]]; then
            echo "::error::rl-java-client resolved to ${resolved}, expected ${RL_JAVA_CLIENT_COMMIT}"
            exit 1
          fi
          echo "rl-java-client pinned commit: ${resolved}" >> "$GITHUB_STEP_SUMMARY"

          # Stamp the dependency with its own commit timestamp so the jar this release builds
          # against is itself deterministic for a given pin.
          client_epoch="$(git -C "$RL_JAVA_CLIENT_DIR" show -s --format=%ct HEAD)"
          mvn -B -ntp -f "$RL_JAVA_CLIENT_DIR/pom.xml" \
            -Dproject.build.outputTimestamp="$client_epoch" \
            install

      - name: Build and test the reactor
        shell: bash
        env:
          SOURCE_DATE_EPOCH: ${{ needs.metadata.outputs.epoch }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail

          # Maven does not read SOURCE_DATE_EPOCH from the environment; it reads
          # project.build.outputTimestamp. The pom does not set that property, so it is passed
          # here from the commit timestamp. Without it, two builds of the same commit produce
          # different jars -- the next step proves these do not.
          #
          # install, not package: the modules depend on each other, and the surefire tests in
          # ratelimitly-spring-boot-autoconfigure run here. A failing test stops the release.
          mvn -B -ntp \
            -Dproject.build.outputTimestamp="$SOURCE_DATE_EPOCH" \
            clean install

          staged="$RUNNER_TEMP/release-jars"
          mkdir -p "$staged"
          for module in $RELEASE_MODULES; do
            jar="${module}/target/${module}-${VERSION}.jar"
            if [[ ! -f "$jar" ]]; then
              echo "::error::${module} produced no ${jar}"
              exit 1
            fi
            cp "$jar" "$staged/"
          done
          ls -l "$staged"

      - name: Verify the jars are byte-reproducible
        shell: bash
        env:
          SOURCE_DATE_EPOCH: ${{ needs.metadata.outputs.epoch }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          ( cd "$RUNNER_TEMP/release-jars" && sha256sum ./*.jar ) \
            | sed 's#\./##' | LC_ALL=C sort -k2 > "$RUNNER_TEMP/first-pass.sha256"

          # Tests are skipped on this pass only because they already passed above; they do not
          # contribute to the jars, so the comparison stays like for like.
          mvn -B -ntp -DskipTests \
            -Dproject.build.outputTimestamp="$SOURCE_DATE_EPOCH" \
            clean install

          rebuilt="$RUNNER_TEMP/rebuilt-jars"
          mkdir -p "$rebuilt"
          for module in $RELEASE_MODULES; do
            cp "${module}/target/${module}-${VERSION}.jar" "$rebuilt/"
          done
          ( cd "$rebuilt" && sha256sum ./*.jar ) \
            | sed 's#\./##' | LC_ALL=C sort -k2 > "$RUNNER_TEMP/second-pass.sha256"

          if ! diff -u "$RUNNER_TEMP/first-pass.sha256" "$RUNNER_TEMP/second-pass.sha256"; then
            echo "::error::two builds of the same commit produced different jars"
            exit 1
          fi
          {
            echo "### Reproducible jars"
            echo
            echo "Two independent builds of this commit agreed byte for byte."
            echo
            echo '```'
            cat "$RUNNER_TEMP/first-pass.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release jars
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-jars
          path: ${{ runner.temp }}/release-jars/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  aggregate:
    name: Validate complete release
    if: needs.metadata.outputs.build == 'true'
    needs:
      - metadata
      - contracts
      - jars
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Download every release artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: release-*
          path: ${{ runner.temp }}/release-inputs

      - name: Reject partial or unexpected release sets
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          inputs="$RUNNER_TEMP/release-inputs"
          assets="$RUNNER_TEMP/release-assets"
          mkdir -p "$assets"

          # The exact set, not "at least". A release missing one module's jar, or carrying a
          # stray extra file, fails here rather than shipping.
          expected=()
          for module in $RELEASE_MODULES; do
            expected+=("${module}-${VERSION}.jar")
          done

          found=()
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            if [[ -e "$assets/$name" ]]; then
              echo "::error::two build jobs produced an asset named ${name}"
              exit 1
            fi
            cp "$file" "$assets/$name"
            found+=("$name")
          done < <(find "$inputs" -type f -print0)

          printf '%s\n' "${expected[@]}" | LC_ALL=C sort > "$RUNNER_TEMP/expected.txt"
          printf '%s\n' "${found[@]}" | LC_ALL=C sort > "$RUNNER_TEMP/found.txt"
          if ! diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/found.txt"; then
            echo "::error::the built assets are not exactly the expected release set"
            exit 1
          fi

          ( cd "$assets" && sha256sum ./*.jar | sed 's#\./##' | LC_ALL=C sort -k2 > SHA256SUMS )
          {
            echo "### Release assets"
            echo
            echo '```'
            cat "$assets/SHA256SUMS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  attest:
    name: Attest release assets
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.metadata.outputs.publish == 'true'
    needs:
      - metadata
      - aggregate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download exact release assets
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: release-assets
          path: release-assets

      - name: Create build provenance attestations
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: 'release-assets/*'

  publish:
    name: Publish atomic GitHub release
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.metadata.outputs.publish == 'true'
    needs:
      - metadata
      - aggregate
      - attest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download exact release assets
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: release-assets
          path: release-assets

      - name: Upload to a draft, verify, then publish
        shell: bash
        env:
          COMMIT: ${{ needs.metadata.outputs.commit }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail

          # This job publishes a GitHub Release with attached jars. It does NOT publish to
          # Maven Central or GitHub Packages: that needs GPG signing keys and registry
          # credentials that do not exist for this repository. See
          # ratelimitly-com/rl-java-client#9.
          find release-assets -maxdepth 1 -type f -printf '%f\n' \
            | LC_ALL=C sort > "$RUNNER_TEMP/expected-assets.txt"

          notes="$RUNNER_TEMP/release-notes.md"
          {
            echo "\`ratelimitly-spring-boot-*\` ${VERSION}, built from ${COMMIT}."
            echo
            echo "Verify the assets with \`sha256sum -c SHA256SUMS\`. The jars are byte-reproducible"
            echo "from this commit, built against rl-java-client ${RL_JAVA_CLIENT_COMMIT}."
            echo
            echo "These artifacts are not published to any Maven repository."
          } > "$notes"

          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != true ]]; then
              echo "::error::${TAG} is already published; refusing to overwrite it"
              exit 1
            fi
          else
            gh release create "$TAG" \
              --draft \
              --target "$COMMIT" \
              --title "$TAG" \
              --notes-file "$notes"
          fi

          # Assets land on a draft first. A half-uploaded release must never be visible.
          gh release upload "$TAG" release-assets/* --clobber

          gh release view "$TAG" --json assets --jq '.assets[].name' \
            | LC_ALL=C sort > "$RUNNER_TEMP/actual-assets.txt"
          if ! diff -u "$RUNNER_TEMP/expected-assets.txt" "$RUNNER_TEMP/actual-assets.txt"; then
            echo "::error::${TAG} did not receive every asset; leaving it as a draft"
            exit 1
          fi

          gh release edit "$TAG" --draft=false --latest
          if [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != false ]]; then
            echo "::error::${TAG} is still a draft after publishing"
            exit 1
          fi
          echo "Published ${TAG} at ${COMMIT}" >> "$GITHUB_STEP_SUMMARY"
