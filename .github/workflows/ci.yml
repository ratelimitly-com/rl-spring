name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check whitespace
        run: |
          set -eu
          rc=0

          if git grep -nIE '[[:space:]]+$' -- .; then
            echo "::error::tracked files contain trailing whitespace"
            rc=1
          fi

          missing=$(git ls-files | while IFS= read -r file; do
            [ -s "$file" ] || continue
            if [ "$(tail -c 1 -- "$file" | wc -l)" -eq 0 ]; then
              printf '%s\n' "$file"
            fi
          done)
          if [ -n "$missing" ]; then
            printf '%s\n' "$missing"
            echo "::error::tracked files do not end with a newline"
            rc=1
          fi

          exit "$rc"

      - name: Validate Maven reactor
        # validate builds the effective model for all four projects without resolving the
        # Java-client artifact, so it is a cheap structural check that needs
        # no sibling checkout.
        run: mvn -B -ntp validate

  build-test:
    name: build and test (${{ matrix.name }}, JDK ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, name: Linux, java: '21'}
          - {os: ubuntu-latest, name: Linux, java: '25'}
          - {os: macos-latest, name: macOS, java: '21'}
          - {os: windows-latest, name: Windows, java: '21'}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test the reactor
        run: mvn -B -ntp install

      - name: Test standalone consumer of installed starter
        run: mvn -B -ntp -f integration-tests/consumer/pom.xml verify

      - name: Verify every module produced a jar
        run: |
          set -eu
          for module in \
            ratelimitly-spring-boot-autoconfigure \
            ratelimitly-spring-boot-starter \
            ratelimitly-spring-boot-sample-app; do
            jar=$(ls "$module"/target/"$module"-*.jar 2>/dev/null | head -n 1 || true)
            if [ -z "$jar" ]; then
              echo "::error::$module produced no jar"
              exit 1
            fi
            echo "$jar"
          done
